# Phase 1 universe: FX + equities only. Crypto is explicitly out of scope until Phase 5
# (FRD Section 8.1 / Scope Decision, Section 3).
#
# cadence_minutes for FX "1hour" is pinned to 15 (the upper end of the FRD's 5-15 minute band,
# Section 8.4), not an arbitrary choice: Twelve Data's free tier is capped at 800 requests/day,
# and each pipeline cycle spends one request per FX pair. 8 pairs x 96 cycles/day (15-min cadence)
# = 768 requests/day, which fits under the cap with a small margin. A 10-minute cadence (144
# cycles/day) would need 1,152 requests/day and blow the free quota. This is documented as a
# deliberate budget-fit decision -- see README "Known constraints".

fx:
  source: twelvedata
  pairs:
    - symbol: EUR/USD
    - symbol: GBP/USD
    - symbol: USD/JPY
    - symbol: AUD/USD
    - symbol: USD/CAD
    - symbol: USD/CHF
    - symbol: EUR/GBP
    - symbol: EUR/JPY
  intervals:
    "1hour":
      cadence_minutes: 15
      provider_interval: "1h"
      # FX trades ~24/5; the only expected gap is the Fri-close -> Sun-open weekend.
      # Tolerance is set just under that so a mid-week outage still gets flagged, while the
      # weekly weekend close does not (documented tradeoff, see pipeline/quality/checks.py).
      gap_tolerance_minutes: 2800
    "1day":
      cadence_minutes: 1440
      provider_interval: "1day"
      gap_tolerance_minutes: 5760   # tolerate a long weekend/holiday (~4 days) on daily bars
  daily_request_budget: 760   # safety margin under Twelve Data's 800/day free cap

equities:
  source: alpaca_iex
  feed: iex
  note: >
    US large-caps only. Alpaca's free IEX feed is single-venue US equities; it does not cover
    UK large-caps named in FRD Section 8.1. UK equity coverage would require a paid feed
    (e.g. Refinitiv/LSEG, EODHD) and is logged here as a known Phase 1 limitation to revisit
    later (FRD Section 10, cost transparency) rather than silently dropped.
  universe:
    - symbol: JPM
      sector: financials
    - symbol: BAC
      sector: financials
    - symbol: GS
      sector: financials
    - symbol: WFC
      sector: financials
    - symbol: AAPL
      sector: technology
    - symbol: MSFT
      sector: technology
    - symbol: XOM
      sector: energy
    - symbol: CVX
      sector: energy
    - symbol: KO
      sector: consumer_staples
    - symbol: PEP
      sector: consumer_staples
  intervals:
    "1hour":
      cadence_minutes: 60
      provider_timeframe: "1Hour"
      # US equities trade ~6.5h/day; overnight + weekend closures are expected and would
      # otherwise swamp gap detection with false positives (documented tradeoff).
      gap_tolerance_minutes: 4000
    "1day":
      cadence_minutes: 1440
      provider_timeframe: "1Day"
      gap_tolerance_minutes: 5760

# Phase 2 (cointegration engine, FRD Section 8.2). Deliberately scoped to the "1day" interval
# only -- the FRD's own rolling-window language ("60-120 trading days") is a daily-resolution
# concept, and hourly bars would need a much larger lag/window in bar-count terms plus bring in
# intraday microstructure autocorrelation this phase doesn't address. Same "documented scope
# narrowing, not an oversight" pattern as the Phase 1 Scope Decision (FRD Section 3).
cointegration:
  fx:
    window_bars: 90     # ~90 trading days, within the FRD's 60-120 day band
    step_bars: 5         # roll forward ~weekly
    baskets:
      # Classic FX triangular no-arbitrage relationship -- log(EURGBP) ~ log(EURUSD) -
      # log(GBPUSD) in a frictionless market, i.e. textbook cointegration structure, not an
      # arbitrary 3-asset pick.
      - ["EUR/USD", "GBP/USD", "EUR/GBP"]
  equities:
    window_bars: 90
    step_bars: 5
    baskets:
      - ["JPM", "BAC", "GS", "WFC"]   # financials, sector-matched per FRD 8.1

# Phase 4 (signal generation, risk management, walk-forward backtest; FRD Sections 8.6-8.8).
# Shared across both asset classes -- the backtest CLI takes --asset-class to pick the universe.
backtest:
  starting_equity: 1000000.0
  z_lookback_bars: 20          # spread z-score normalization window (shorter than the 90-bar
                                # cointegration window on purpose -- a faster-moving local mean,
                                # fixed at each walk-forward refit, never updated intra-segment)
  z_entry: 2.0
  z_exit: 0.5
  transaction_cost_bps: 2.0     # per leg notional, charged on both entry and exit
  slippage_bps: 1.0              # additional haircut, logged as its own line item (Section 9
                                  # cost transparency) rather than folded silently into the fee
  target_daily_vol_per_position: 1000.0   # dollars -- vol-targeting sizes to this, using the
                                            # in-sample spread's day-to-day std
  max_loss_per_position_pct: 2.0           # % of starting_equity -- the LTCM-derived leverage
                                            # cap, sized off the in-sample spread's WORST single-
                                            # day move, not its typical (std) move
  portfolio_max_drawdown_pct: 15.0          # breach halts new entries for the rest of the run;
                                             # "manual review to resume" has no meaning inside a
                                             # single backtest replay, so it simply stays halted
  liquidity:
    equity_adv_fraction: 0.01               # equities: cap position at 1% of recent $ ADV
                                             # (Phase 1 stores real volume for equities)
    fx_max_notional_per_position: 2000000.0  # FX: Phase 1 has no consolidated FX volume data
                                              # (documented Phase 1 limitation) -- this fixed
                                              # notional cap is the liquidity proxy used here in
                                              # its absence, not a claim of equivalent rigor
