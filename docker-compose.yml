services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: multi_asset_timescaledb
    environment:
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_pass
      POSTGRES_DB: multi_asset_pipeline
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/schema_phase2.sql:/docker-entrypoint-initdb.d/02_schema_phase2.sql:ro
      - ./db/schema_phase3.sql:/docker-entrypoint-initdb.d/03_schema_phase3.sql:ro
      - ./db/schema_phase4.sql:/docker-entrypoint-initdb.d/04_schema_phase4.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d multi_asset_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10
